[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smarttester"
version = "0.0.0"
description = "A unit test function/classes generator for Python using LLM multi-step prompts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Marco Ganassin", email = "marcoganassin96@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.8"
dependencies = [
    "openai==0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.2",
    "colorama>=0.4.6",
    "pluggy>=1.3.0",
    "exceptiongroup>=1.1.3",
    "iniconfig>=2.0.0",
]
dev = [
    "pytest>=7.4.2",
    "colorama>=0.4.6",
    "pluggy>=1.3.0", 
    "exceptiongroup>=1.1.3",
    "iniconfig>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/marcoganassin96/smart-tester"
Repository = "https://github.com/marcoganassin96/smart-tester.git"
Issues = "https://github.com/marcoganassin96/smart-tester/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/python/smart-tester/smarttester/package/smarttester"]

[tool.hatch.build.targets.wheel.sources]
"src/python/smart-tester/smarttester/package" = ""